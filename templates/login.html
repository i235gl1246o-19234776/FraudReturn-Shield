
<!-- login.html - Страница авторизации -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudReturn Shield — Авторизация</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container {
            background: white;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .login-logo svg {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #7F30E3, #F90479);
            padding: 10px;
            border-radius: 16px;
            color: white;
        }

        .login-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7F30E3, #F90479);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-form .form-group {
            margin-bottom: 25px;
        }

        .login-form label {
            display: block;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--gray-700);
            margin-bottom: 10px;
        }

        .login-form input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            background: white;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--wb-purple);
            box-shadow: 0 0 0 4px rgba(127, 48, 227, 0.1);
            transform: translateY(-2px);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #F90479, #FE5F00);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 20px rgba(249, 4, 121, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(249, 4, 121, 0.6);
        }

        .login-error {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }

        .login-info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--gray-200);
            text-align: center;
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .demo-credentials {
            background: var(--gray-50);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .demo-credentials h4 {
            font-size: 0.9rem;
            color: var(--gray-700);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .demo-credentials p {
            color: var(--gray-600);
            line-height: 1.8;
        }

        .demo-credentials code {
            background: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: var(--wb-purple);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <h1>FraudReturn Shield</h1>
                </div>
                <p style="color: var(--gray-600);">Войдите в систему для продолжения</p>
            </div>

            <div id="error-message" class="login-error"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login" placeholder="Введите ваш логин" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
                </div>
                <button type="submit" class="login-btn">
                    Войти
                </button>
            </form>

            <div class="login-info">
                <div class="demo-credentials">
                    <h4>📋 Демо-учетные данные:</h4>
                    <p><strong>Администратор:</strong><br>
                       Логин: <code>admin</code> | Пароль: <code>admin123</code></p>
                    <p style="margin-top: 10px;"><strong>Клиенты:</strong><br>
                       Логин: <code>user1</code>...<code>user9</code> | Пароль: <code>pass123</code></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ login, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Сохраняем информацию о пользователе в sessionStorage
                    sessionStorage.setItem('user', JSON.stringify(data.user));

                    // Перенаправляем в зависимости от роли
                    if (data.user.role === 'admin') {
                        window.location.href = '/admin/profile';
                    } else {
                        window.location.href = '/client/profile';
                    }
                } else {
                    errorDiv.textContent = data.error || 'Неверный логин или пароль';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Ошибка подключения к серверу';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
