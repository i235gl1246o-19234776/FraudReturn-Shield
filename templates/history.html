<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История — FraudReturn Shield</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .admin-nav {
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .admin-nav-links a {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: var(--radius-lg);
            transition: var(--transition-fast);
        }

        .admin-nav-links a:hover,
        .admin-nav-links a.active {
            color: var(--wb-purple);
            background: var(--gray-100);
        }

        .admin-nav-links a.active {
            background: var(--wb-purple);
            color: white;
        }

        .logout-btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .logout-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <div class="container">
            <a href="/admin/profile" class="nav-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                FraudReturn Shield
            </a>
            <ul class="admin-nav-links">
                <li><a href="/admin/profile">Профиль</a></li>
                <li><a href="/check">Проверка</a></li>
                <li><a href="/users">Пользователи</a></li>
                <li><a href="/history" class="active">История</a></li>
                <li><a href="/admin/chat">AI Нейросеть</a></li>
            </ul>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </nav>

        <!-- Основной контент -->
        <main class="main">
            <div class="container">
                <div class="card">
                    <div class="card-header">
                        <h2>История возвратов</h2>
                        <button class="btn btn-secondary btn-sm" onclick="clearHistory()">Очистить</button>
                    </div>
                    <div class="card-body">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>Дата</th>
                                    <th>Заказ</th>
                                    <th>Клиент</th>
                                    <th>Сумма</th>
                                    <th>Риск</th>
                                    <th>Решение</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr>
                                    <td colspan="6" style="text-align: center; color: var(--gray-500); padding: 40px;">
                                        Нет данных в истории
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>© 2026 FraudReturn Shield. Учебный проект</p>
            </div>
        </footer>
    </div>

    <script>
        function loadHistory() {
            const fraudHistory = JSON.parse(localStorage.getItem('fraudHistory') || '[]');
            const tbody = document.getElementById('historyTableBody');
            if (fraudHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--gray-500); padding: 40px;">Нет данных в истории</td></tr>';
                return;
            }
            tbody.innerHTML = fraudHistory.map(item => {
                const date = new Date(item.timestamp).toLocaleDateString('ru-RU');
                const riskClass = item.result.riskClass;
                const riskBadge = riskClass === 'low' ? '🟢 Низкий' : riskClass === 'medium' ? '🟡 Средний' : '🔴 Высокий';
                const decision = item.decision ? (item.decision === 'approved' ? '✅ Одобрено' : item.decision === 'rejected' ? '❌ Отклонено' : '⚠️ Проверка') : '—';
                return `<tr><td>${date}</td><td>#${item.data.orderID}</td><td>#${item.data.clientID}</td><td>${item.data.orderAmount.toLocaleString()} ₽</td><td><span class="user-badge ${riskClass}">${riskBadge}</span></td><td>${decision}</td></tr>`;
            }).join('');
        }

        function clearHistory() {
            if (confirm('Очистить всю историю?')) {
                localStorage.setItem('fraudHistory', JSON.stringify([]));
                loadHistory();
                showToast('История очищена', 'success');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.5s ease-out forwards';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>


<script>
    function logout() {
        sessionStorage.removeItem('user');
        fetch('/api/logout', { method: 'POST' })
            .then(() => {
                window.location.href = '/login';
            })
            .catch(() => {
                window.location.href = '/login';
            });
    }
</script>

</body>
</html>
