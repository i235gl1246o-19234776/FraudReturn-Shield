<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История — FraudReturn Shield</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .admin-nav {
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .admin-nav-links a {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: var(--radius-lg);
            transition: var(--transition-fast);
        }

        .admin-nav-links a:hover,
        .admin-nav-links a.active {
            color: var(--wb-purple);
            background: var(--gray-100);
        }

        .admin-nav-links a.active {
            background: var(--wb-purple);
            color: white;
        }

        .logout-btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .logout-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <div class="container">
            <a href="/admin/profile" class="nav-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                FraudReturn Shield
            </a>
            <ul class="admin-nav-links">
                <li><a href="/admin/profile">Профиль</a></li>
                <li><a href="/check">Проверка</a></li>
                <li><a href="/users">Пользователи</a></li>
                <li><a href="/history" class="active">История</a></li>
                <li><a href="/admin/chat">AI Нейросеть</a></li>
            </ul>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </nav>

        <!-- Основной контент -->
        <main class="main">
            <div class="container">
                <div class="card">
                    <div class="card-header">
                        <h2>История возвратов</h2>
                        <button class="btn btn-secondary btn-sm" onclick="clearHistory()">Очистить</button>
                    </div>
                    <div class="card-body">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>Дата</th>
                                    <th>Заказ</th>
                                    <th>Клиент</th>
                                    <th>Сумма</th>
                                    <th>Риск</th>
                                    <th>Решение</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr>
                                    <td colspan="6" style="text-align: center; color: var(--gray-500); padding: 40px;">
                                        Нет данных в истории
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>© 2026 FraudReturn Shield. Учебный проект</p>
            </div>
        </footer>
    </div>

    <script>
        function loadHistory() {
            const tbody = document.getElementById('historyTableBody');

            // Загружаем из БД через API (если доступно)
            fetch('/api/history')
                .then(res => res.json())
                .then(data => {
                    if (data.checks && data.checks.length > 0) {
                        renderHistory(data.checks);
                    } else {
                        showNoData();
                    }
                })
                .catch(() => {
                    // Fallback на localStorage
                    const fraudHistory = JSON.parse(localStorage.getItem('fraudHistory') || '[]');
                    if (fraudHistory.length === 0) {
                        showNoData();
                        return;
                    }
                    const legacyData = fraudHistory.map(item => ({
                        check_id: item.data.orderID,
                        order_id: item.data.orderID,
                        client_id: item.data.clientID,
                        order_amount: item.data.orderAmount,
                        risk_score: item.data.riskScore || 0,
                        risk_level: item.data.riskLevel || 'low',
                        risk_class: item.data.riskClass || 'low',
                        recommendation: item.data.recommendation || '—',
                        checked_at: item.timestamp
                    }));
                    renderHistory(legacyData);
                });
        }

        function renderHistory(checks) {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = checks.map(item => {
                const date = new Date(item.checked_at).toLocaleDateString('ru-RU');
                const riskClass = item.risk_class || 'low';
                const riskIcon = riskClass === 'low' ? '/static/svg/зеленый.svg' : riskClass === 'medium' ? '/static/svg/желтый.svg' : '/static/svg/красный.svg';
                const riskText = riskClass === 'low' ? 'Низкий' : riskClass === 'medium' ? 'Средний' : 'Высокий';
                const riskBadge = `<img src="${riskIcon}" alt="" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;"> ${riskText}`;
                const amount = (item.order_amount || 0).toLocaleString();
                return `<tr>
                    <td>${date}</td>
                    <td>#${item.order_id}</td>
                    <td>#${item.client_id}</td>
                    <td>${amount} ₽</td>
                    <td><span class="user-badge ${riskClass}">${riskBadge}</span></td>
                    <td>${item.recommendation || '—'}</td>
                </tr>`;
            }).join('');
        }

        function showNoData() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--gray-500); padding: 40px;">Нет данных в истории</td></tr>';
        }

        function clearHistory() {
            if (confirm('Очистить всю историю?')) {
                // Очищаем localStorage
                localStorage.removeItem('fraudHistory');

                // Очищаем БД через API
                fetch('/api/clear-history', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        loadHistory();
                        showToast('История очищена', 'success');
                    })
                    .catch(err => {
                        // Даже если БД недоступна, localStorage уже очищен
                        loadHistory();
                        showToast('История очищена', 'success');
                    });
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const iconSrc = type === 'success' ? '/static/svg/галочка.svg' : '/static/svg/крест.svg';
            toast.innerHTML = `<img src="${iconSrc}" alt="" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 4px;"><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.5s ease-out forwards';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>


<script>
    function logout() {
        sessionStorage.removeItem('user');
        fetch('/api/logout', { method: 'POST' })
            .then(() => {
                window.location.href = '/login';
            })
            .catch(() => {
                window.location.href = '/login';
            });
    }
</script>

</body>
</html>
