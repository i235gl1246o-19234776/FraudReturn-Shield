<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат — FraudReturn Shield</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .admin-nav {
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .admin-nav-links a {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: var(--radius-lg);
            transition: var(--transition-fast);
        }

        .admin-nav-links a:hover,
        .admin-nav-links a.active {
            color: var(--wb-purple);
            background: var(--gray-100);
        }

        .admin-nav-links a.active {
            background: var(--wb-purple);
            color: white;
        }

        .logout-btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .logout-btn:hover {
            background: #667eea;
            color: white;
        }

        .risk-gauge { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px 0; }
        .gauge-circle { position: relative; width: 120px; height: 120px; }
        .gauge-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .gauge-bg { fill: none; stroke: var(--gray-200); stroke-width: 8; }
        .gauge-fill {
            fill: none; stroke: var(--wb-purple); stroke-width: 8;
            stroke-linecap: round; stroke-dasharray: 283; stroke-dashoffset: 283;
            transition: stroke-dashoffset 0.8s ease-out, stroke 0.3s ease;
        }
        .gauge-fill.low { stroke: var(--success); }
        .gauge-fill.medium { stroke: #f59e0b; }
        .gauge-fill.high { stroke: var(--error); }
        .gauge-value {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.5rem; font-weight: 800; color: var(--text);
        }
        .risk-badge {
            display: flex; align-items: center; gap: 10px; padding: 10px 20px;
            border-radius: var(--radius-lg); background: var(--gray-100); font-weight: 600;
        }
        .risk-badge.low { background: rgba(34,197,94,0.15); color: var(--success); }
        .risk-badge.medium { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .risk-badge.high { background: rgba(239,68,68,0.15); color: var(--error); }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <div class="container">
            <a href="/admin/profile" class="nav-logo">
                <img src="/static/svg/щит.svg" alt="Shield">
                FraudReturn Shield
            </a>
            <ul class="admin-nav-links">
                <li><a href="/admin/profile">Профиль</a></li>
                <li><a href="/check">Проверка</a></li>
                <li><a href="/users">Пользователи</a></li>
                <li><a href="/history">История</a></li>
                <li><a href="/admin/chat">AI Нейросеть</a></li>
            </ul>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </nav>

        <main class="main">
            <div class="container">
                <div class="card result-card">
                    <div class="card-header">
                        <h2>Результат анализа</h2>
                        <a href="/check" class="btn btn-secondary">Новая проверка</a>
                    </div>
                    <div class="card-body">
                        <div class="risk-gauge">
                            <div class="gauge-circle">
                                <svg viewBox="0 0 100 100">
                                    <circle class="gauge-bg" cx="50" cy="50" r="45"/>
                                   <circle class="gauge-fill" cx="50" cy="50" r="45"/>
                                </svg>
                                <div class="gauge-value">—%</div>
                            </div>
                            <div class="risk-badge">
                                <img src="/static/svg/зеленый.svg" alt="" style="width: 80px; height: 80px; vertical-align: middle;">
                                <span>— риск</span>
                            </div>
                        </div>
                        <div class="recommendation">
                            <strong>Рекомендация</strong>
                            <p>Загрузка...</p>
                        </div>
                        <div style="display: flex; gap: 15px; margin-top: 25px;">
                            <a href="/history" class="btn btn-secondary" style="flex: 1;">В историю</a>
                            <a href="/" class="btn btn-primary" style="flex: 1;">На главную</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>© 2026 FraudReturn-Shield.</p>
            </div>
        </footer>
    </div>

<script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const orderID = urlParams.get('order_id') || '—';
        const clientID = urlParams.get('client_id') || '—';
        const riskScore = parseFloat(urlParams.get('risk_score')) || 0;
        const riskLevel = urlParams.get('risk_level') || 'unknown';
        const riskClass = urlParams.get('risk_class') || 'medium';
        const recommendation = urlParams.get('recommendation') || 'Нет рекомендации';
        const orderAmount = parseFloat(urlParams.get('order_amount')) || 0;

        const topFactors = [];
        let i = 0;
        while (urlParams.get(`factor_${i}`)) {
            topFactors.push(urlParams.get(`factor_${i}`));
            i++;
        }

        const riskPercent = Math.round(riskScore * 100);
        const strokeDashOffset = (1 - riskScore) * 283;

        let iconPath = 'зеленый.svg';
        if (riskClass === 'medium') iconPath = 'желтый.svg';
        if (riskClass === 'high') iconPath = 'красный.svg';

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const riskScore = parseFloat(urlParams.get('risk_score')) || 0;
            const riskClass = urlParams.get('risk_class') || 'medium';
            const riskPercent = Math.round(riskScore * 100);
            
            const gaugeValue = document.querySelector('.gauge-value');
            if (gaugeValue) gaugeValue.textContent = `${riskPercent}%`;
            
            const gaugeFill = document.querySelector('.gauge-fill');
            if (gaugeFill) {
                gaugeFill.style.strokeDashoffset = (1 - riskScore) * 283;
                gaugeFill.classList.add(riskClass);
            }
            const resultCard = document.querySelector('.result-card');
            if (resultCard) {
                resultCard.className = `card result-card ${riskClass}`;
            }

            const riskBadge = document.querySelector('.risk-badge');
            if (riskBadge) {
                riskBadge.className = `risk-badge ${riskClass}`;
                const img = riskBadge.querySelector('img');
                if (img) img.src = `/static/svg/${iconPath}`;
                const span = riskBadge.querySelector('span');
                if (span) {
                    const levelText = riskClass === 'low' ? 'Низкий' : riskClass === 'medium' ? 'Средний' : 'Высокий';
                    span.textContent = `${levelText} риск`;
                }
            }

            const recEl = document.querySelector('.recommendation p');
            if (recEl) recEl.textContent = recommendation;

            if (topFactors.length > 0) {
                const factorsSection = document.querySelector('.factors');
                if (!factorsSection) {
                    const recSection = document.querySelector('.recommendation');
                    if (recSection) {
                        const factorsHtml = `
                            <div class="factors" style="margin-top: 20px;">
                                <h3>Факторы риска</h3>
                                <ul class="factor-list">
                                    ${topFactors.map(f => `<li>${f}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                        recSection.insertAdjacentHTML('afterend', factorsHtml);
                    }
                } else {
                    const factorList = factorsSection.querySelector('.factor-list');
                    if (factorList) {
                        factorList.innerHTML = topFactors.map(f => `<li>${f}</li>`).join('');
                    }
                }
            }

            saveToHistory();
        });

        function saveToHistory() {
            const resultData = {
                orderID: parseInt(orderID) || 0,
                clientID: parseInt(clientID) || 0,
                orderAmount: orderAmount,
                riskScore: riskScore,
                riskLevel: riskLevel,
                riskClass: riskClass,
                recommendation: recommendation,
                topFactors: topFactors
            };

            const historyItem = {
                timestamp: new Date().toISOString(),
                data: resultData
            };

            let fraudHistory = JSON.parse(localStorage.getItem('fraudHistory') || '[]');

            fraudHistory.unshift(historyItem);

            if (fraudHistory.length > 100) {
                fraudHistory = fraudHistory.slice(0, 100);
            }

            localStorage.setItem('fraudHistory', JSON.stringify(fraudHistory));
            console.log('Проверка сохранена в историю');
        }

        function logout() {
            sessionStorage.removeItem('user');
            fetch('/api/logout', { method: 'POST' })
                .then(() => {
                    window.location.href = '/login';
                })
                .catch(() => {
                    window.location.href = '/login';
                });
        }
    </script>

</body>
</html>
