<!-- client_profile.html - Страница профиля клиента -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudReturn Shield — Профиль клиента</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --wb-purple: #7F30E3;
            --gray-50: #f8f9fa;
            --gray-100: #f1f3f5;
            --gray-200: #e9ecef;
            --gray-400: #adb5bd;
            --gray-500: #868e96;
            --gray-600: #495057;
            --gray-800: #212529;
            --success: #28a745;
            --success-bg: #d4edda;
            --warning: #fd7e14;
            --warning-bg: #fff3cd;
            --danger: #dc3545;
            --danger-bg: #f8d7da;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.15);
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: all 0.3s ease;
            --transition-fast: all 0.15s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* === Навигация === */
        .client-nav {
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .client-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--wb-purple);
            font-weight: 800;
            font-size: 1.2rem;
        }

        .nav-logo svg {
            width: 24px;
            height: 24px;
        }

        .client-nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .client-nav-links a {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: var(--radius-lg);
            transition: var(--transition-fast);
        }

        .client-nav-links a:hover,
        .client-nav-links a.active {
            color: var(--wb-purple);
            background: var(--gray-100);
        }

        .client-nav-links a.active {
            background: var(--wb-purple);
            color: white;
        }

        .logout-btn {
            padding: 10px 20px;
            background: white;
            color: var(--wb-purple);
            border: 2px solid var(--wb-purple);
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--wb-purple);
            color: white;
        }

        /* === Профиль header === */
        .profile-header {
            background: linear-gradient(135deg, #7F30E3, #F90479);
            padding: 60px 0;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--wb-purple);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .profile-id {
            opacity: 0.9;
            font-size: 1rem;
        }

        /* === Маркиз текст в хедере === */
        .header-marquee {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .marquee-text {
            font-size: 3rem;
            font-weight: 800;
            opacity: 0;
            white-space: nowrap;
            transition: opacity 1.5s ease-in-out;
        }

        .marquee-left { text-align: left; }
        .marquee-right { text-align: right; }
        .marquee-text.visible { opacity: 0.9; }

        /* === Щиты по бокам — ФИКСИРОВАННЫЕ, НЕ МАСШТАБИРУЕМЫЕ === */
        .side-shields-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            overflow: hidden;
        }

        /* Обёртка для анимации */
        .side-shield-wrapper {
            animation: float-shield 6s ease-in-out infinite;
            will-change: transform;
        }

        .side-shield-wrapper.left { animation-delay: 0s; }
        .side-shield-wrapper.right { animation-delay: 3s; }

        /* Сам щит — размер и прозрачность */
        .side-shield {
            width: 180px;
            height: 180px;
            opacity: 0.12;
            transition: opacity 0.3s ease;
        }

        .side-shield:hover {
            opacity: 0.2;
        }

        .side-shield img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(127, 48, 227, 0.4));
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        @keyframes float-shield {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }
            50% {
                transform: translateY(-15px) rotate(4deg);
            }
        }

        /* Адаптив — скрываем на мобильных */
        @media (max-width: 768px) {
            .side-shields-container { display: none; }
            .header-marquee { display: none; }
            .tabs-large { grid-template-columns: 1fr; }
        }

        /* === Вкладки карточки === */
        .tabs-large {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin: 60px auto;
            max-width: 1100px;
            position: relative;
            z-index: 10;
        }

        .tab-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 40px 30px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            border: 2px solid transparent;
            display: block;
        }

        .tab-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .tab-orders { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .tab-orders:hover { background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); }

        .tab-returns { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .tab-returns:hover { background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%); }

        .tab-chat { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .tab-chat:hover { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); }

        .tab-card-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-card-icon img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .tab-orders:hover .tab-card-icon img {
            transform: scale(1.3);
            filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.7));
        }

        .tab-returns:hover .tab-card-icon img {
            transform: scale(1.3);
            filter: drop-shadow(0 0 20px rgba(0, 191, 255, 0.7));
        }

        .tab-chat:hover .tab-card-icon img {
            transform: scale(1.3);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.9));
        }

        .tab-card-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .tab-card-desc {
            font-size: 1.3rem;
            opacity: 0.9;
        }

        /* === Карточки заказов === */
        .order-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--wb-purple);
            transition: var(--transition);
        }

        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--gray-100);
        }

        .order-id {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gray-800);
        }

        .order-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .order-status.completed { background: var(--success-bg); color: var(--success); }
        .order-status.pending { background: var(--warning-bg); color: var(--warning); }
        .order-status.returned { background: var(--danger-bg); color: var(--danger); }
        .order-status.processing { background: #e0e7ff; color: var(--wb-purple); }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .order-detail-item {
            background: var(--gray-50);
            padding: 12px;
            border-radius: var(--radius);
        }

        .order-detail-label {
            font-size: 0.85rem;
            color: var(--gray-600);
            margin-bottom: 5px;
        }

        .order-detail-value {
            font-weight: 600;
            color: var(--gray-800);
        }

        /* === Кнопка чата === */
        .chat-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--wb-purple);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            z-index: 1000;
        }

        .chat-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 40px rgba(127, 48, 227, 0.5);
        }

        .chat-toggle svg {
            width: 28px;
            height: 28px;
        }

        /* === Toast уведомления === */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid var(--success);
        }
        .toast.error { border-left-color: #dc3545; }
        .toast.warning { border-left-color: #fd7e14; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="client-nav">
        <div class="container">
            <a href="/client/profile" class="nav-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                FraudReturn Shield
            </a>
            <ul class="client-nav-links">
                <li><a href="/client/profile" class="active">Профиль</a></li>
                <li><a href="/client/orders">Заказы</a></li>
                <li><a href="/client/returns">Возвраты</a></li>
                <li><a href="/client/chat">AI Нейросеть</a></li>
            </ul>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </nav>

    <!-- Заголовок профиля -->
    <section class="profile-header">
        <div class="header-marquee">
            <span class="marquee-text marquee-left" id="marqueeLeft">Добро пожаловать!</span>
            <span class="marquee-text marquee-right" id="marqueeRight">Быстрые возвраты</span>
        </div>
        <div class="container">
            <div class="profile-avatar" id="userAvatar">U</div>
            <h1 class="profile-name" id="userName">Пользователь</h1>
            <p class="profile-id" id="userId">ID: --</p>
        </div>
    </section>

    <!-- 🛡️ Декоративные щиты по бокам (НЕ МАСШТАБИРУЮТСЯ) -->
    <div class="side-shields-container" id="sideShields">
        <div class="side-shield-wrapper left">
            <div class="side-shield">
                <img src="/static/svg/щит.svg" alt="Защита">
            </div>
        </div>
        <div class="side-shield-wrapper right">
            <div class="side-shield">
                <img src="/static/svg/щит.svg" alt="Защита">
            </div>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="container">
        <div class="tabs-large">
            <a href="/client/orders" class="tab-card tab-orders">
                <div class="tab-card-icon">
                    <img src="/static/svg/коробка.svg" alt="Заказы">
                </div>
                <div class="tab-card-title">Мои заказы</div>
                <div class="tab-card-desc">Просмотр всех заказов</div>
            </a>
            <a href="/client/returns" class="tab-card tab-returns">
                <div class="tab-card-icon">
                    <img src="/static/svg/стрелка назад.svg" alt="Возвраты">
                </div>
                <div class="tab-card-title">Возвраты</div>
                <div class="tab-card-desc">Оформить возврат</div>
            </a>
            <a href="/client/chat" class="tab-card tab-chat">
                <div class="tab-card-icon">
                    <img src="/static/svg/робот.svg" alt="AI Нейросеть">
                </div>
                <div class="tab-card-title">AI Нейросеть</div>
                <div class="tab-card-desc">Помощник и проверки</div>
            </a>
        </div>
    </div>

    <!-- Кнопка чата -->
    <button class="chat-toggle" onclick="toggleChat()" title="Открыть чат">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
    </button>

    <!-- 🛡️ СКРИПТ: фиксация размера щитов при зуме -->
    <script>
        // === Фиксация размера щитов при браузерном зуме ===
        (function fixShieldZoom() {
            const shieldsContainer = document.getElementById('sideShields');
            if (!shieldsContainer) return;

            // Создаём эталонный элемент для детекции зума
            const ref = document.createElement('div');
            ref.style.cssText = 'position:fixed;left:0;top:0;width:100px;height:100px;visibility:hidden;pointer-events:none;z-index:-9999;';
            document.body.appendChild(ref);

            function getBrowserZoom() {
                // Сравниваем визуальную ширину эталона с его логической шириной
                const logicalWidth = 100;
                const visualWidth = ref.getBoundingClientRect().width;
                return visualWidth / logicalWidth;
            }

            function updateShieldScale() {
                const zoom = getBrowserZoom();
                const inverseScale = 1 / zoom;
                
                // Применяем компенсацию только к внутреннему .side-shield
                const shields = document.querySelectorAll('.side-shield');
                shields.forEach(shield => {
                    shield.style.transform = `scale(${inverseScale})`;
                    shield.style.transformOrigin = 'center center';
                });
            }

            // Обновление при ресайзе (включая зум)
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(updateShieldScale, 100);
            });

            // Инициализация
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(updateShieldScale, 200); // Небольшая задержка для стабильности
            });

            // Периодическая проверка (на всякий случай)
            setInterval(updateShieldScale, 1000);
        })();
    </script>

    <!-- Основной скрипт страницы -->
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function() {
            const storedUser = sessionStorage.getItem('user');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
                loadUserProfile();
            } else {
                window.location.href = '/login';
            }
        });

        function loadUserProfile() {
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.login || 'Пользователь';
                document.getElementById('userId').textContent = `ID: ${currentUser.id}`;
                document.getElementById('userAvatar').textContent = (currentUser.login || 'U')[0].toUpperCase();
            }
        }

        function logout() {
            sessionStorage.removeItem('user');
            fetch('/api/logout', { method: 'POST' })
                .then(() => { window.location.href = '/login'; })
                .catch(() => { window.location.href = '/login'; });
        }

        function toggleChat() {
            window.location.href = '/client/chat';
        }

        // === Анимация текста в хедере ===
        const leftTexts = ['Добро пожаловать!', 'Рады видеть вас снова!', 'Защита ваших покупок', 'Удобный возврат', 'Быстро и просто'];
        const rightTexts = ['Быстрые возвраты', 'AI помощник 24/7', 'Безопасные сделки', 'Поддержка всегда рядом', 'Удобные покупки'];

        let leftIndex = 0, rightIndex = 0;
        let isLeftVisible = true, isRightVisible = false;

        function cycleMarqueeText() {
            const leftEl = document.getElementById('marqueeLeft');
            const rightEl = document.getElementById('marqueeRight');

            if (isLeftVisible) {
                leftEl.classList.remove('visible');
                setTimeout(() => {
                    leftIndex = (leftIndex + 1) % leftTexts.length;
                    leftEl.textContent = leftTexts[leftIndex];
                    rightEl.textContent = rightTexts[rightIndex];
                    rightEl.classList.add('visible');
                    isRightVisible = true; isLeftVisible = false;
                }, 1500);
            } else if (isRightVisible) {
                rightEl.classList.remove('visible');
                setTimeout(() => {
                    rightIndex = (rightIndex + 1) % rightTexts.length;
                    rightEl.textContent = rightTexts[rightIndex];
                    leftEl.textContent = leftTexts[leftIndex];
                    leftEl.classList.add('visible');
                    isLeftVisible = true; isRightVisible = false;
                }, 1500);
            }
        }

        document.getElementById('marqueeLeft').textContent = leftTexts[0];
        document.getElementById('marqueeLeft').classList.add('visible');
        setInterval(cycleMarqueeText, 6000);

        // === Toast уведомления ===
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : '⚠️'}</span><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.5s ease-out forwards';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
