
<!-- client_profile.html - Страница профиля клиента -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudReturn Shield — Профиль клиента</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .client-nav {
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .client-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .client-nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .client-nav-links a {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: var(--radius-lg);
            transition: var(--transition-fast);
        }

        .client-nav-links a:hover,
        .client-nav-links a.active {
            color: var(--wb-purple);
            background: var(--gray-100);
        }

        .client-nav-links a.active {
            background: var(--wb-purple);
            color: white;
        }

        .profile-header {
            background: linear-gradient(135deg, #7F30E3, #F90479);
            padding: 60px 0;
            text-align: center;
            color: white;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--wb-purple);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .profile-id {
            opacity: 0.9;
            font-size: 1rem;
        }

        .tabs-large {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin: 60px 0;
        }

        .tab-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 70px 50px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            border: 2px solid transparent;
            display: block;
        }

        .tab-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .tab-orders {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-orders:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .tab-returns {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .tab-returns:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }

        .tab-chat {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .tab-chat:hover {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }

        .tab-card-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-card-icon img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            transition: transform 0.3s ease, filter 0.3s ease;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            shape-rendering: geometricPrecision;
            text-rendering: geometricPrecision;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
        }

        .tab-orders:hover .tab-card-icon img {
            transform: scale(1.3) translate3d(0, 0, 0);
            filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.7));
        }

        .tab-returns:hover .tab-card-icon img {
            transform: scale(1.3) translate3d(0, 0, 0);
            filter: drop-shadow(0 0 20px rgba(0, 191, 255, 0.7));
        }

        .tab-chat:hover .tab-card-icon img {
            transform: scale(1.3) translate3d(0, 0, 0);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.9));
        }

        .tab-shield {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .tab-shield:hover {
            background: linear-gradient(135deg, #38ef7d 0%, #11998e 100%);
        }

        .tab-shield:hover .tab-card-icon img {
            transform: scale(2) translate3d(0, 0, 0);
            filter: drop-shadow(0 0 20px rgba(17, 153, 142, 0.7));
        }


        .tab-card-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .tab-card-desc {
            font-size: 1.3rem;
            opacity: 0.9;
        }

      /* Боковые щиты - большие */
        .side-shields-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
            margin: 60px 0;
            padding: 0 20px;
        }

        .side-shield-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 100px 80px;
            text-align: center;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            border: 2px solid transparent;
            cursor: pointer;
            flex: 0 0 auto;
            min-width: 300px;
            animation: pulse-shield 2s ease-in-out infinite;
        }

        .side-shield-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(17, 153, 142, 0.6), 0 0 60px rgba(56, 239, 125, 0.4);
            border-color: rgba(17, 153, 142, 0.3);
        }

        .side-shield-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .side-shield-icon img {
            width: 400px;
            height: 400px;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            shape-rendering: geometricPrecision;
            text-rendering: geometricPrecision;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
        }

        .side-shield-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 15px;
        }

        .side-shield-desc {
            font-size: 1.3rem;
            color: var(--gray-600);
        }

        @keyframes pulse-shield {
            0%, 100% {
                transform: scale(1);
                box-shadow: var(--shadow-md);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 6px 30px rgba(17, 153, 142, 0.3), 0 0 40px rgba(56, 239, 125, 0.2);
            }
        }

        .side-shield-left {
            margin-right: auto;
            animation-delay: 0s;
        }

        .side-shield-right {
            margin-left: auto;
            animation-delay: 1s;
        }

        .order-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--wb-purple);
            transition: var(--transition);
        }

        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--gray-100);
        }

        .order-id {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gray-800);
        }

        .order-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .order-status.completed {
            background: var(--success-bg);
            color: var(--success);
        }

        .order-status.pending {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .order-status.returned {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .order-status.processing {
            background: #e0e7ff;
            color: var(--wb-purple);
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .order-detail-item {
            background: var(--gray-50);
            padding: 12px;
            border-radius: var(--radius);
        }

        .order-detail-label {
            font-size: 0.85rem;
            color: var(--gray-600);
            margin-bottom: 5px;
        }

        .order-detail-value {
            font-weight: 600;
            color: var(--gray-800);
        }

        .logout-btn {
            padding: 10px 20px;
            background: white;
            color: var(--wb-purple);
            border: 2px solid var(--wb-purple);
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .header-marquee {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .marquee-text {
            font-size: 5rem; /* Увеличенный размер */
            font-weight: 800;
            opacity: 0;
            white-space: nowrap;
            transition: opacity 1.5s ease-in-out; /* Быстрое исчезновение за 1.5 сек */
        }

        .marquee-left {
            text-align: left;
        }

        .marquee-right {
            text-align: right;
        }

        .marquee-text.visible {
            opacity: 0.9;
        }


        .logout-btn:hover {
            background: var(--wb-purple);
            color: white;
        }

        .profile-header {
            background: linear-gradient(135deg, #7F30E3, #F90479);
            padding: 60px 0;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header-marquee {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .marquee-text {
            font-size: 3rem; /* Увеличенный размер */
            font-weight: 800;
            opacity: 0;
            white-space: nowrap;
            transition: opacity 1.5s ease-in-out; /* Быстрое исчезновение за 1.5 сек */
        }

        .marquee-left {
            text-align: left;
        }

        .marquee-right {
            text-align: right;
        }

        .marquee-text.visible {
            opacity: 0.9;
        }

    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="client-nav">
        <div class="container">
            <a href="/client/profile" class="nav-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                FraudReturn Shield
            </a>
            <ul class="client-nav-links">
                <li><a href="/client/profile" class="active">Профиль</a></li>
                <li><a href="/client/orders">Заказы</a></li>
                <li><a href="/client/returns">Возвраты</a></li>
                <li><a href="/client/chat">AI Нейросеть</a></li>
            </ul>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </nav>

    <!-- Заголовок профиля -->
    <section class="profile-header">
        <div class="header-marquee">
            <span class="marquee-text marquee-left" id="marqueeLeft">Добро пожаловать!</span>
            <span class="marquee-text marquee-right" id="marqueeRight">Быстрые возвраты</span>
        </div>
        <div class="container">
            <div class="profile-avatar" id="userAvatar">U</div>
            <h1 class="profile-name" id="userName">Пользователь</h1>
            <p class="profile-id" id="userId">ID: --</p>
        </div>
    </section>

    <!-- Основной контент -->
    <div class="container">
        <!-- Вкладки - большие карточки -->
        <div class="tabs-large">
            <a href="/client/orders" class="tab-card tab-orders">
                <div class="tab-card-icon">
                    <img src="/static/svg/коробка.svg" alt="Заказы">
                </div>
                <div class="tab-card-title">Мои заказы</div>
                <div class="tab-card-desc">Просмотр всех заказов</div>
            </a>
            <a href="/client/returns" class="tab-card tab-returns">
                <div class="tab-card-icon">
                    <img src="/static/svg/стрелка назад.svg" alt="Возвраты">
                </div>
                <div class="tab-card-title">Возвраты</div>
                <div class="tab-card-desc">Оформить возврат</div>
            </a>
            <a href="/client/chat" class="tab-card tab-chat">
                <div class="tab-card-icon">
                    <img src="/static/svg/робот.svg" alt="AI Нейросеть">
                </div>
                <div class="tab-card-title">AI Нейросеть</div>
                <div class="tab-card-desc">Помощник и проверки</div>
            </a>
        </div>
    </div>

    <div class="container">
        <div class="side-shields-wrapper">
            <div class="side-shield-card" onclick="toggleChat()">
                <div class="side-shield-icon">
                    <img src="/static/svg/щит.svg" alt="Защита">
                </div>
            </div>
            <div class="side-shield-card" onclick="toggleChat()">
                <div class="side-shield-icon">
                    <img src="/static/svg/щит.svg" alt="Защита">
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка чата -->
    <button class="chat-toggle" onclick="toggleChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
    </button>

    <script>
        let currentUser = null;

        // Загрузка данных пользователя при инициализации
        document.addEventListener('DOMContentLoaded', function() {
            const storedUser = sessionStorage.getItem('user');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
                loadUserProfile();
            } else {
                window.location.href = '/login';
            }
        });

        function loadUserProfile() {
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.login || 'Пользователь';
                document.getElementById('userId').textContent = `ID: ${currentUser.id}`;
                document.getElementById('userAvatar').textContent = (currentUser.login || 'U')[0].toUpperCase();
            }
        }

        function loadOrders() {
            fetch(`/api/client/orders?client_id=${currentUser.id}`)
                .then(response => response.json())
                .then(data => {
                    const ordersList = document.getElementById('orders-list');

                    if (data.orders && data.orders.length > 0) {
                        // Преобразуем данные с сервера в формат для отображения
                        const orders = data.orders.map(order => ({
                            id: order.order_id,
                            date: order.order_timestamp,
                            amount: parseFloat(order.order_amount) || 0,
                            //status: order.order_status || 'completed',
                            items: order.items_count || 1,
                            //payment_method: order.payment_method || '-',
                            product_category: order.product_category || '-',
                            delivery_date: order.delivery_date || '-',
                            //discount_amount: parseFloat(order.discount_amount) || 0,
                            //amount_deviation: parseFloat(order.amount_deviation) || 0,
                            //client_id: order.client_id || currentUser.id
                        }));

                        ordersList.innerHTML = orders.map(order => `
                            <div class="order-card">
                                <div class="order-header">
                                    <span class="order-id">Заказ #${order.id}</span>
                                </div>
                                <div class="order-details">
                                    <div class="order-detail-item">
                                        <div class="order-detail-label">Дата заказа</div>
                                        <div class="order-detail-value">${order.date}</div>
                                    </div>
                                    <div class="order-detail-item">
                                        <div class="order-detail-label">Сумма</div>
                                        <div class="order-detail-value">${order.amount.toLocaleString()} ₽</div>
                                    </div>
                                    <div class="order-detail-item">
                                        <div class="order-detail-label">Товаров</div>
                                        <div class="order-detail-value">${order.items} шт.</div>
                                    </div>
                                    <div class="order-detail-item">
                                        <div class="order-detail-label">Категория</div>
                                        <div class="order-detail-value">${order.product_category}</div>
                                    </div>
                                </div>
                                <div class="order-actions" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--gray-100); display: flex; gap: 10px;">
                                    <button class="btn btn-primary" onclick="viewOrderDetails(${order.id})">Подробнее</button>
                                    ${order.status === 'completed' ? `<button class="btn btn-secondary" onclick="initiateReturn(${order.id})">Оформить возврат</button>` : ''}
                                </div>
                            </div>
                        `).join('');
                    } else {
                        ordersList.innerHTML = '<p style="text-align: center; color: var(--gray-600); padding: 40px;">У вас пока нет заказов</p>';
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки заказов:', error);
                    const ordersList = document.getElementById('orders-list');
                    ordersList.innerHTML = '<p style="text-align: center; color: var(--danger); padding: 40px;">Ошибка загрузки заказов</p>';
                });
        }

        function logout() {
            sessionStorage.removeItem('user');
            fetch('/api/logout', { method: 'POST' })
                .then(() => {
                    window.location.href = '/login';
                })
                .catch(() => {
                    window.location.href = '/login';
                });
        }

         const leftTexts = [
            'Добро пожаловать!',
            'Рады видеть вас \nснова!',
            'Защита ваших \nпокупок',
            'Удобный возврат',
            'Быстро и просто'
        ];

        const rightTexts = [
            'Быстрые возвраты',
            'AI помощник 24/7',
            'Безопасные сделки',
            'Поддержка всегда \nрядом',
            'Удобные покупки'
        ];

        let leftIndex = 0;
        let rightIndex = 0;
        let isLeftVisible = true;
        let isRightVisible = false;

        // Функция для плавного переключения текста
        function cycleMarqueeText() {
            const leftElement = document.getElementById('marqueeLeft');
            const rightElement = document.getElementById('marqueeRight');

            if (isLeftVisible) {
                // Скрываем левый текст
                leftElement.classList.remove('visible');

                setTimeout(() => {
                    // Меняем текст пока он скрыт
                    leftIndex = (leftIndex + 1) % leftTexts.length;
                    leftElement.textContent = leftTexts[leftIndex];

                    // Показываем правый текст
                    rightElement.textContent = rightTexts[rightIndex];
                    rightElement.classList.add('visible');
                    isRightVisible = true;
                    isLeftVisible = false;
                }, 1500); // Ждём пока исчезнет (1.5 секунды)
            } else if (isRightVisible) {
                // Скрываем правый текст
                rightElement.classList.remove('visible');

                setTimeout(() => {
                    // Меняем текст пока он скрыт
                    rightIndex = (rightIndex + 1) % rightTexts.length;
                    rightElement.textContent = rightTexts[rightIndex];

                    // Показываем левый текст
                    leftElement.textContent = leftTexts[leftIndex];
                    leftElement.classList.add('visible');
                    isLeftVisible = true;
                    isRightVisible = false;
                }, 1500); // Ждём пока исчезнет (1.5 секунды)
            }
        }

        // Инициализация - показываем первый левый текст
        document.getElementById('marqueeLeft').textContent = leftTexts[0];
        document.getElementById('marqueeLeft').classList.add('visible');

        // Запускаем цикл переключения каждые 6 секунд (1.5 сек появление + 3 сек видимость + 1.5 сек исчезновение)
        setInterval(cycleMarqueeText, 6000);
    </script>
</body>
</html>
