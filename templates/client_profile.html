
<!-- client_profile.html - Страница профиля клиента -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudReturn Shield — Профиль клиента</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .client-nav {
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .client-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .client-nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .client-nav-links a {
            text-decoration: none;
            color: var(--gray-600);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: var(--radius-lg);
            transition: var(--transition-fast);
        }

        .client-nav-links a:hover,
        .client-nav-links a.active {
            color: var(--wb-purple);
            background: var(--gray-100);
        }

        .client-nav-links a.active {
            background: var(--wb-purple);
            color: white;
        }

        .profile-header {
            background: linear-gradient(135deg, #7F30E3, #F90479);
            padding: 60px 0;
            text-align: center;
            color: white;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--wb-purple);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .profile-id {
            opacity: 0.9;
            font-size: 1rem;
        }

        .tabs-large {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .tab-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 35px 25px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            border: 2px solid transparent;
            display: block;
        }

        .tab-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .tab-orders {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-orders:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .tab-returns {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .tab-returns:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }

        .tab-chat {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .tab-chat:hover {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }

        .tab-card-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .tab-card-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .tab-card-desc {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .order-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--wb-purple);
            transition: var(--transition);
        }

        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--gray-100);
        }

        .order-id {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gray-800);
        }

        .order-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .order-status.completed {
            background: var(--success-bg);
            color: var(--success);
        }

        .order-status.pending {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .order-status.returned {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .order-status.processing {
            background: #e0e7ff;
            color: var(--wb-purple);
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .order-detail-item {
            background: var(--gray-50);
            padding: 12px;
            border-radius: var(--radius);
        }

        .order-detail-label {
            font-size: 0.85rem;
            color: var(--gray-600);
            margin-bottom: 5px;
        }

        .order-detail-value {
            font-weight: 600;
            color: var(--gray-800);
        }

        .logout-btn {
            padding: 10px 20px;
            background: white;
            color: var(--wb-purple);
            border: 2px solid var(--wb-purple);
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .logout-btn:hover {
            background: var(--wb-purple);
            color: white;
        }

    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="client-nav">
        <div class="container">
            <a href="/client/profile" class="nav-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                FraudReturn Shield
            </a>
            <ul class="client-nav-links">
                <li><a href="/client/profile" class="active">Профиль</a></li>
                <li><a href="/client/orders">Заказы</a></li>
                <li><a href="/client/returns">Возвраты</a></li>
                <li><a href="/client/chat">AI Нейросеть</a></li>
            </ul>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </nav>

    <!-- Заголовок профиля -->
    <section class="profile-header">
        <div class="container">
            <div class="profile-avatar" id="userAvatar">U</div>
            <h1 class="profile-name" id="userName">Пользователь</h1>
            <p class="profile-id" id="userId">ID: --</p>
        </div>
    </section>

    <!-- Основной контент -->
    <div class="container">
        <!-- Вкладки - большие карточки -->
        <div class="tabs-large">
            <a href="/client/orders" class="tab-card tab-orders">
                <div class="tab-card-icon">📦</div>
                <div class="tab-card-title">Мои заказы</div>
                <div class="tab-card-desc">Просмотр всех заказов</div>
            </a>
            <a href="/client/returns" class="tab-card tab-returns">
                <div class="tab-card-icon">↩️</div>
                <div class="tab-card-title">Возвраты</div>
                <div class="tab-card-desc">Оформить возврат</div>
            </a>
            <a href="/client/chat" class="tab-card tab-chat">
                <div class="tab-card-icon">🤖</div>
                <div class="tab-card-title">AI Нейросеть</div>
                <div class="tab-card-desc">Помощник и проверки</div>
            </a>
        </div>
    </div>

    <!-- Кнопка чата -->
    <button class="chat-toggle" onclick="toggleChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
    </button>

    <script>
        let currentUser = null;

        // Загрузка данных пользователя при инициализации
        document.addEventListener('DOMContentLoaded', function() {
            const storedUser = sessionStorage.getItem('user');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
                loadUserProfile();
            } else {
                window.location.href = '/login';
            }
        });

        function loadUserProfile() {
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.login || 'Пользователь';
                document.getElementById('userId').textContent = `ID: ${currentUser.id}`;
                document.getElementById('userAvatar').textContent = (currentUser.login || 'U')[0].toUpperCase();
            }
        }

        function loadOrders() {
            fetch(`/api/client/orders?client_id=${currentUser.id}`)
                .then(response => response.json())
                .then(data => {
                    const ordersList = document.getElementById('orders-list');

                    if (data.orders && data.orders.length > 0) {
                        // Преобразуем данные с сервера в формат для отображения
                        const orders = data.orders.map(order => ({
                            id: order.order_id,
                            date: order.order_timestamp,
                            amount: parseFloat(order.order_amount) || 0,
                            //status: order.order_status || 'completed',
                            items: order.items_count || 1,
                            //payment_method: order.payment_method || '-',
                            product_category: order.product_category || '-',
                            delivery_date: order.delivery_date || '-',
                            //discount_amount: parseFloat(order.discount_amount) || 0,
                            //amount_deviation: parseFloat(order.amount_deviation) || 0,
                            //client_id: order.client_id || currentUser.id
                        }));

                        ordersList.innerHTML = orders.map(order => `
                            <div class="order-card">
                                <div class="order-header">
                                    <span class="order-id">Заказ #${order.id}</span>
                                </div>
                                <div class="order-details">
                                    <div class="order-detail-item">
                                        <div class="order-detail-label">Дата заказа</div>
                                        <div class="order-detail-value">${order.date}</div>
                                    </div>
                                    <div class="order-detail-item">
                                        <div class="order-detail-label">Сумма</div>
                                        <div class="order-detail-value">${order.amount.toLocaleString()} ₽</div>
                                    </div>
                                    <div class="order-detail-item">
                                        <div class="order-detail-label">Товаров</div>
                                        <div class="order-detail-value">${order.items} шт.</div>
                                    </div>
                                    <div class="order-detail-item">
                                        <div class="order-detail-label">Категория</div>
                                        <div class="order-detail-value">${order.product_category}</div>
                                    </div>
                                </div>
                                <div class="order-actions" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--gray-100); display: flex; gap: 10px;">
                                    <button class="btn btn-primary" onclick="viewOrderDetails(${order.id})">Подробнее</button>
                                    ${order.status === 'completed' ? `<button class="btn btn-secondary" onclick="initiateReturn(${order.id})">Оформить возврат</button>` : ''}
                                </div>
                            </div>
                        `).join('');
                    } else {
                        ordersList.innerHTML = '<p style="text-align: center; color: var(--gray-600); padding: 40px;">У вас пока нет заказов</p>';
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки заказов:', error);
                    const ordersList = document.getElementById('orders-list');
                    ordersList.innerHTML = '<p style="text-align: center; color: var(--danger); padding: 40px;">Ошибка загрузки заказов</p>';
                });
        }

        function logout() {
            sessionStorage.removeItem('user');
            fetch('/api/logout', { method: 'POST' })
                .then(() => {
                    window.location.href = '/login';
                })
                .catch(() => {
                    window.location.href = '/login';
                });
        }
    </script>
</body>
</html>
